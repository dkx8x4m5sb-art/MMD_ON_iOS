
name: MMDStudio Build

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "No ZIP file found"
            exit 1
          fi

          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

          PROJECT_FILE=$(find extracted -name project.yml -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            echo "project.yml not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          cp -R "$PROJECT_DIR"/. .

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build iOS App
        run: |
          set -euo pipefail

          xcodebuild \
            -project MMDStudio.xcodeproj \
            -scheme MMDStudio \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
            
      - name: Package IPA
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for built app..."

          APP_PATH=$(find build -type d -name "*.app" -print -quit)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app bundle found."
            echo "Build directory contents:"
            find build -maxdepth 6 -print || true
            exit 1
          fi

          echo "Found app: $APP_PATH"

          mkdir -p Payload
          cp -R "$APP_PATH" Payload/

          zip -qry MMDStudio.ipa Payload

          echo "IPA generated:"
          ls -lh MMDStudio.ipa


      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MMDStudio-IPA
          path: MMDStudio.ipa
          if-no-files-found: error
          retention-days: 14
